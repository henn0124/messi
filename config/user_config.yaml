# User Configuration
users:
  default:
    name: "Default User"
    preferences:
      voice: "alloy"
      language: "en"
      volume: 1.0
      speed: 1.0
    
  # User template (for new users)
  template:
    preferences:
      voice: "alloy"
      language: "en"
      volume: 1.0
      speed: 1.0
    history: []
    context: "general"
    
# Session settings
session:
  timeout: 300  # seconds
  max_history: 50
  
# Authentication settings
auth:
  enabled: false
  method: "voice"  # voice, password, or both
  
# Voice recognition settings
voice_recognition:
  enabled: false
  min_samples: 3
  confidence_threshold: 0.8
  
# User data storage
storage:
  users_file: "data/users.json"
  backup_count: 5
  auto_save: true
  save_interval: 300  # seconds
